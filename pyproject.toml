[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phocinae-rulepack"
version = "0.1.2"
description = "Deterministic rule-pack engine: read a ledger, apply a versioned rule pack, emit only the differences for human review. Zero model calls, zero third-party runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Phocinae" }]
keywords = [
  "rule-engine", "deterministic", "compliance", "checklist", "fail-closed",
  "decision-model", "phocinae", "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# PyYAML is a TEST-ONLY cross-check for the built-in YAML-subset parser.
# It is deliberately NOT a runtime dependency.
yamltest = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Phocinae/phocinae-rulepack"
Repository = "https://github.com/Phocinae/phocinae-rulepack"
Issues = "https://github.com/Phocinae/phocinae-rulepack/issues"

[project.scripts]
phocinae-rulepack = "phocinae_rulepack.cli:main"

[tool.setuptools]
packages = ["phocinae_rulepack"]

[tool.setuptools.package-data]
phocinae_rulepack = [
  "packs/*/rulepack.yaml",
  "packs/*/sources/*",
  "packs/*/rulepack.yaml.draft",
  "packs/*/sources/*/*",
  # GAPS.md is referenced from the shipped rulepack.yaml and from the CHANGELOG,
  # so it has to travel with the pack; a pointer to a file that is not in the
  # wheel sends the reader nowhere.
  "packs/*/GAPS.md",
  "schema/*.json",
]
